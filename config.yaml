name: "Eisfach Inventar Server"
description: "SQLite-backed Eisfach inventory backend and REST API server for Home Assistant"
version: "1.0.3"
slug: "eisfach"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Eisfach REST API & Web UI Port"
map:
  - config:rw
startup: application
boot: auto
url: "https://github.com/Korbinian0/Eisfach"
ingress:
  - host: "localhost"
    port: 8000