<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisfach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
    <div id="login-section" class="container mt-5" style="max-width: 400px;">
        <div class="card p-4">
            <h2 class="text-center mb-4">❄️ Eisfach Login</h2>
            <form id="login-form">
                <div class="mb-3"><label>Benutzername</label><input type="text" id="username" class="form-control" required></div>
                <div class="mb-3"><label>Passwort</label><input type="password" id="password" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">Anmelden</button>
            </form>
            <div id="login-error" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>
    <div id="app-section" class="container py-4 d-none">
        <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 px-3">
            <span class="navbar-brand">❄️ Eisfach</span>
            <div class="ms-auto d-flex align-items-center">
                <span id="user-display" class="me-3 text-muted"></span>
                <button id="admin-tab-btn" class="btn btn-outline-secondary btn-sm me-2 d-none" onclick="showAdminTab()">Admin</button>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Abmelden</button>
            </div>
        </nav>
        <div id="inventory-view">
            <div class="row mb-3">
                <div class="col-md-6 mb-2"><button class="btn btn-success w-100 py-2" data-bs-toggle="modal" data-bs-target="#scanModal">📷 Barcode Scannen / Eingeben</button></div>
                <div class="col-md-6"><input type="text" id="search-input" class="form-control py-2" placeholder="🔍 Bestand durchsuchen..." onkeyup="filterInventory()"></div>
            </div>
            <div class="card p-3">
                <h4 class="mb-3">📦 Aktueller Bestand</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead><tr><th>ID</th><th>Barcode</th><th>Name</th><th>Lagerort</th><th>Menge</th><th>Einlagerdatum</th><th>Aktionen</th></tr></thead>
                        <tbody id="inventory-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="admin-view" class="d-none">
            <button class="btn btn-secondary mb-3" onclick="showInventoryTab()">⬅️ Zurück</button>
            <div class="row">
                <div class="col-md-6"><div class="card p-3 mb-3">
                    <h5>🖨️ Barcodes Generieren</h5>
                    <div class="mb-3"><input type="number" id="barcode-count" class="form-control" value="5" min="1" max="50"></div>
                    <button class="btn btn-primary" onclick="generateBarcodesForPrint()">Barcodes anzeigen</button>
                    <div id="print-preview" class="mt-3"></div>
                </div></div>
                <div class="col-md-6"><div class="card p-3 mb-3">
                    <h5>📍 Lagerorte</h5>
                    <div class="input-group mb-3"><input type="text" id="new-location-input" class="form-control" placeholder="Neuer Lagerort"><button class="btn btn-success" onclick="createLocation()">+</button></div>
                    <ul id="locations-list" class="list-group"></ul>
                </div></div>
            </div>
            <div class="card p-3 mb-3">
                <h5>👥 Benutzerverwaltung</h5>
                <form id="register-user-form" class="row g-2 mb-3">
                    <div class="col-md-4"><input type="text" id="new-username" class="form-control" placeholder="Benutzername" maxlength="100" required></div>
                    <div class="col-md-3"><input type="password" id="new-password" class="form-control" placeholder="Passwort" required></div>
                    <div class="col-md-3"><select id="new-role" class="form-select"><option value="0">Benutzer</option><option value="1">Admin</option></select></div>
                    <div class="col-md-2"><button type="submit" class="btn btn-success w-100">Erstellen</button></div>
                </form>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead><tr><th>Benutzername</th><th>Rolle</th><th>Aktionen</th></tr></thead>
                        <tbody id="users-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="scanModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Barcode Scannen / Eingeben</h5><button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopScanner()"></button></div>
        <div class="modal-body">
            <div class="mb-3"><div id="scanner-container"><video id="video" muted autoplay playsinline style="width:100%; max-height:250px;"></video></div>
            <button class="btn btn-outline-primary btn-sm mt-2" onclick="startScanner()">Kamera starten</button>
            <button class="btn btn-outline-secondary btn-sm mt-2" onclick="stopScanner()">Kamera stoppen</button></div>
            <div class="input-group mb-3"><input type="text" id="manual-barcode-input" class="form-control" placeholder="Barcode..."><button class="btn btn-primary" onclick="processBarcode()">Prüfen</button></div>
            <div id="scan-result-area"></div>
        </div>
    </div></div></div>
    <div class="modal fade" id="actionModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content" id="action-modal-content"></div></div></div>
    <div class="modal fade" id="edit-user-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
        <form id="edit-user-form">
            <div class="modal-header"><h5 class="modal-title">Benutzer bearbeiten</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-user-id">
                <div class="mb-3"><label for="edit-username" class="form-label">Benutzername</label><input type="text" id="edit-username" class="form-control" maxlength="100" required></div>
                <div class="mb-3"><label for="edit-role" class="form-label">Rolle</label><select id="edit-role" class="form-select"><option value="0">Benutzer</option><option value="1">Admin</option></select></div>
                <div class="mb-3"><label for="edit-password" class="form-label">Neues Passwort (optional)</label><input type="password" id="edit-password" class="form-control" autocomplete="new-password"></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button><button type="submit" class="btn btn-primary">Speichern</button></div>
        </form>
    </div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
